<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0609" />
  <title>Chastity Tracker – Offline</title>
  <!-- Die Werte sind aus der Vorgabewelt `sub-open` abgeschrieben (globals.css) und NICHT geteilt:
       diese Seite liefert der Service Worker ohne die App und damit ohne Stylesheet. Wer die Welt
       dort ändert, ändert sie hier mit — sonst steht der Offline-Bildschirm als einziger im alten
       Anstrich da. -->
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: sans-serif;
      background: #0b0609;
      color: #fdf7f8;
      text-align: center;
      padding: 24px;
    }
    svg { opacity: .4; }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    p  { margin: 0; font-size: 0.95rem; color: #c9b7bd; }
    button {
      margin-top: 8px;
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      background: #ff3d68;
      color: #2b0410;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="112" fill="#111827"/>
    <rect x="138" y="248" width="236" height="176" rx="36" fill="white"/>
    <path d="M176 248V192a80 80 0 0 1 160 0v56" fill="none" stroke="white" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="330" r="26" fill="#111827"/>
    <rect x="242" y="330" width="28" height="40" rx="10" fill="#111827"/>
  </svg>
  <!-- Der deutsche Server-Fall steht als TEXT im Markup, nicht nur in der Tabelle unten. Diese Seite
       erscheint per Definition, wenn etwas kaputt ist — sie darf nicht zusätzlich davon abhängen,
       dass ihr eigenes Skript durchläuft. Vorher waren die drei Elemente leer und wurden erst vom
       Skript gefüllt: ein Fehler darin, und der Nutzer sah eine komplett leere Seite. Das Skript
       ÄNDERT diesen Stand nur noch, wenn es etwas Besseres weiss (andere Sprache, kein Netz). -->
  <h1 id="title">Nicht erreichbar</h1>
  <p id="text">Der Server hat nicht geantwortet. Das lag nicht an deinem Gerät.</p>
  <button id="retry" onclick="location.reload()">Erneut versuchen</button>
  <script>
    /* Diese Seite sagt jetzt, WELCHE der beiden Störungen vorliegt. Vorher nannte ein Satz beide
       ("nicht verfügbar ODER keine Verbindung") und lag damit immer halb daneben — am ärgerlichsten
       im häufigsten Fall: das WLAN steht, der Server hat nur nicht geantwortet, und der Nutzer sucht
       den Fehler bei sich.

       Unterschieden wird über `navigator.onLine`, und zwar nur in seiner verlässlichen Richtung:
       `false` heisst sicher "kein Netz". Sein `true` beweist nichts, taugt hier aber, weil beide
       verbleibenden Ursachen (Server weg, Empfang zu schlecht) dieselbe Auskunft verdienen: es lag
       nicht am Gerät. */
    var german = !navigator.language || navigator.language.indexOf('de') === 0;
    var noNetwork = navigator.onLine === false;
    document.documentElement.lang = german ? 'de' : 'en';

    var texts = {
      de: {
        offline: ['Keine Verbindung', 'Dein Gerät ist gerade nicht im Netz. Sobald es wieder da ist, geht es von selbst weiter.'],
        server: ['Nicht erreichbar', 'Der Server hat nicht geantwortet. Das lag nicht an deinem Gerät.'],
        retry: 'Erneut versuchen'
      },
      en: {
        offline: ['No connection', 'Your device is offline. This page continues on its own as soon as it is back.'],
        server: ['Not available', 'The server did not respond. This was not your device.'],
        retry: 'Try again'
      }
    };

    var t = texts[german ? 'de' : 'en'];
    var headline = noNetwork ? t.offline : t.server;
    document.getElementById('title').textContent = headline[0];
    document.getElementById('text').textContent = headline[1];
    document.getElementById('retry').textContent = t.retry;

    /* Von selbst zurück — aber NUR auf ein echtes Signal hin, nie auf Verdacht.

       Ein Countdown, der im Hintergrund weiterlädt, wäre hier genau der Fehler, den das (+)-Blatt
       gerade abgelegt hat: Ist der Server langsam, weil er zu tun hat, macht jeder ungefragte
       Versuch die Lage schlechter. Deshalb zwei Auslöser, die beide etwas BEDEUTEN:
       `online` (das Gerät hat wieder Netz) und die Rückkehr zur App (der Nutzer schaut wieder hin —
       genau der Moment, in dem bisher der App-Neustart half). */
    var shownAt = Date.now();

    /* `online` OHNE Sperrfrist. Es meldet einen echten Zustandswechsel und kann nur feuern, wenn das
       Gerät vorher ohne Netz war — schleifen kann es also nicht. Eine Frist davor wäre sogar
       schädlich: kommt das WLAN eine Sekunde nach dem Fehlschlag zurück, ist dieses Ereignis das
       EINZIGE, das je wieder kommt. Verschluckt man es, bleibt der Nutzer auf dieser Seite sitzen,
       obwohl längst alles wieder da ist. */
    addEventListener('online', function () { location.reload(); });

    /* Die Rückkehr zur App dagegen braucht die Frist: eine Seite, die im Hintergrund geladen wird
       und gleich darauf sichtbar wird, löste sonst sofort einen zweiten Aufruf aus, dessen Ergebnis
       dasselbe wäre. Anders als `online` sagt Sichtbarkeit nichts über die Leitung. */
    addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      if (Date.now() - shownAt < 3000) return;
      location.reload();
    });
  </script>
</body>
</html>
