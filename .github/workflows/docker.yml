name: Build, Push & Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Nach dem Build deployen?"
        required: false
        type: boolean
        default: true
      instances:
        # ⚠ Explizite Namen erscheinen im ÖFFENTLICHEN Dispatch-Input-Record des Runs (Repo ist
        # public). Für gezielte Einzel-Deploys lieber privat per SSH auf dem Server. "Leer = alle"
        # verrät keine Namen (Auto-Discovery serverseitig, Log ist anonymisiert).
        description: "Instanzen updaten (kommagetrennt). Leer = alle (empfohlen; keine Namen im Log)."
        required: false
        default: ""
      channel:
        description: "Ziel-Instanzen auf diesen Image-Tag umpinnen (z.B. portal, feature). Leer = bestehende Pins behalten."
        required: false
        default: ""
      pinnedTo:
        description: "Nur Instanzen deployen, die aktuell auf einen dieser Tags gepinnt sind (kommagetrennt). Leer = automatisch aus den gebauten Tags."
        required: false
        default: ""
      tagFeature:
        description: "Image zusätzlich als :feature taggen (auch bei main-Builds) — damit auf :feature gepinnte Instanzen diesen Build ziehen, ohne umzupinnen."
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Typecheck (parallel zum Docker-Build) ──────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  # ── Docker Image bauen & pushen ────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Welche ROLLENDEN Kanäle dieser Build bewegt hat — der Deploy leitet daraus ab, welche
      # Instanzen neu starten müssen.
      pins: ${{ steps.pins.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from package.json
        run: |
          NEW_VERSION=$(jq -r .version package.json)
          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Drei Ringe — feature → portal → latest:
          #   Feature-Branch (oder tagFeature=true) -> :feature  (trublues Instanz, Tests)
          #   main                                  -> :portal + :v<version>  (Portal-Flotte)
          #   :latest                               NUR über promote.yml (Retag per imagetools,
          #                                         kein Rebuild) — der offizielle Release für
          #                                         alle, inkl. Self-Hoster.
          #
          # `latest=false` ist Absicht und nicht redundant: metadata-action setzt :latest von
          # sich aus nur bei type=ref,event=tag / semver / pep440 / match — heute also nie.
          # Sobald aber jemand `on: push: tags:` ergänzt (naheliegend, seit es einen
          # release-Tag gibt), würde latest=auto :latest wieder selbst veröffentlichen und
          # promote.yml aushebeln.
          flavor: |
            latest=false
          # Reihenfolge zählt: gleichrangige type=raw-Einträge werden nach Deklaration
          # priorisiert, und der erste bestimmt org.opencontainers.image.version. v<version>
          # zuerst → das Label trägt die echte Version (vorher stand dort "latest"), und genau
          # dieses Label ist der Promote-Guard in promote.yml.
          #
          # v<version> ist auf main gegated: ein Feature-Build würde sonst einen bestehenden
          # Versions-Tag mit seinem Digest überschreiben (:v5.0.0 in GHCR ist genau so
          # entstanden — Digest aus einem ungemergten Branch).
          #
          # `inputs.tagFeature` OHNE `== 'true'`: tagFeature ist type: boolean, im
          # inputs-Kontext also ein echter Boolean. `boolean == 'true'` ist in
          # GitHub-Expressions immer false (1 vs. NaN) und hätte :feature auf main still
          # abgeschaltet.
          tags: |
            type=raw,value=v${{ env.NEW_VERSION }},enable={{is_default_branch}}
            type=raw,value=portal,enable={{is_default_branch}}
            type=raw,value=feature,enable=${{ github.ref_name != 'main' || inputs.tagFeature }}
            type=sha,prefix=sha-

      # Einzige Quelle dafür, welche rollenden Kanäle dieser Build bewegt: die Tags, die
      # metadata-action tatsächlich erzeugt hat. Die Alternative — dieselbe Kanal-Logik im
      # Deploy-Aufruf aus `ref_name`/`tagFeature` ein zweites Mal herzuleiten — hätte zwei
      # handsynchrone Fassungen derselben Entscheidung ergeben, und ein Auseinanderdriften
      # äussert sich nicht als Build-Fehler, sondern als falsches Deploy-Ziel.
      # Unveränderliche Tags (v…, sha-…) gehören NICHT dazu: eine Instanz, die bewusst auf
      # :v4.56.0 gepinnt ist, darf ein Build nicht neu starten.
      - name: Bewegte Kanäle bestimmen
        id: pins
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # `latest` steht bewusst in der Liste, obwohl dieser Workflow es nicht (mehr) taggt:
          # sollte es je wieder gebaut werden, müssen die darauf gepinnten Instanzen mitkommen —
          # ein stilles Übersehen wäre schlimmer als ein Zweig, der heute nie greift.
          VALUE=$(printf '%s\n' "$META_TAGS" | sed 's#.*:##' \
            | { grep -Ex 'portal|feature|latest' || true; } | paste -sd, -)
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "Bewegte Kanäle: ${VALUE:-<keine>}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-Datum in einem Step berechnen: `github.run_started_at` ist KEIN gültiges github-Context-
      # Property und lieferte immer einen leeren String → das Build-Arg kam leer an (Issue #20).
      - name: Compute build date
        id: builddate
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.builddate.outputs.value }}

  # ── Deploy auf Server ──────────────────────────────────────────────────────
  # Das Deploy-Skript liegt in deploy.yml (workflow_call) und wird auch von promote.yml
  # genutzt — ein Retag soll die Flotte ohne Rebuild ausrollen können.
  deploy:
    needs: [build-and-push, typecheck]
    if: ${{ inputs.deploy }}
    # Ein `uses:`-Job darf KEIN Job-level `env:` haben (erlaubt sind nur name/uses/with/
    # secrets/strategy/needs/if/concurrency/permissions) — die Inputs gehen deshalb über
    # `with:`. Auch das workflow-level `env` oben ist im aufgerufenen Workflow unsichtbar.
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    # Serialisiert gegen promote.yml: zwei gleichzeitige `docker compose up -d` auf
    # ~/instances wären ein Rennen um dieselben Container.
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    with:
      # NICHT `env.REGISTRY`/`env.IMAGE_NAME`: im `with:` eines `uses:`-Jobs ist der
      # env-Kontext nicht verfügbar (erlaubt sind github/needs/inputs/vars/strategy/matrix) —
      # der Wert käme leer an. Deshalb hier direkt aus dem github-Kontext.
      image: ghcr.io/${{ github.repository }}
      instances: ${{ inputs.instances }}
      channel: ${{ inputs.channel }}
      # Default: genau die Kanäle, die dieser Build bewegt hat (siehe Step „Bewegte Kanäle").
      # Der explizite Input überschreibt das — nötig, wenn nach dem ALTEN Pin gefiltert und
      # auf einen neuen umgepinnt wird (`channel=portal` + `pinnedTo=latest`).
      pinnedTo: ${{ inputs.pinnedTo || needs.build-and-push.outputs.pins }}
