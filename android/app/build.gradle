apply plugin: 'com.android.application'

android {
    namespace = "ch.chastitytracker.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ch.chastitytracker.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release-Signatur: `android/keystore.properties` (gitignoriert, Aufbau in ANDROID.md). Fehlt
    // die Datei, baut `assembleRelease` eine unsignierte APK — kein Fehler, aber nicht installierbar.
    def keystorePropsFile = rootProject.file('keystore.properties')
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                def props = new Properties()
                keystorePropsFile.withInputStream { props.load(it) }
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        // Dev-Variante wie auf iOS (Debug = `ch.chastitytracker.app.dev`, „CT Dev"): liegt NEBEN der
        // ausgelieferten App statt sie zu überschreiben.
        debug {
            applicationIdSuffix ".dev"
            manifestPlaceholders = [appLabel: "CT Dev"]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [appLabel: "@string/app_name"]
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Release-Wächter. Gegenstück zum Xcode-Build-Schritt „Keine Dev-URL im Release":
// - steht nach `CAP_DEV_URL=… npx cap sync android` noch `server.url` in der synchronisierten
//   Config, lädt die ausgelieferte App einen Rechner im LAN des Entwicklers;
// - fehlt `google-services.json`, ist Firebase nicht eingerichtet und die Push-Anmeldung der App
//   scheitert — eine Release-APK ohne Push wäre ein stiller Rückschritt gegenüber iOS.
def hasGoogleServices = file('google-services.json').exists()
tasks.register('checkReleaseReady') {
    doLast {
        def cfg = file('src/main/assets/capacitor.config.json')
        if (cfg.exists() && new groovy.json.JsonSlurper().parse(cfg).server?.url) {
            throw new GradleException("capacitor.config.json enthält server.url (Dev-URL). Vor dem Release `npx cap sync android` OHNE CAP_DEV_URL laufen lassen.")
        }
        if (!hasGoogleServices) {
            throw new GradleException("android/app/google-services.json fehlt (Firebase, siehe ANDROID.md) — ohne sie hat die App keinen Push.")
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'checkReleaseReady' }

// Firebase (Push): das Google-Services-Plugin liest `google-services.json` und erzeugt daraus die
// Konfiguration, mit der Firebase beim Start initialisiert wird. Ohne Plugin stürzt die App beim
// Einschalten der Mitteilungen ab („Default FirebaseApp is not initialized"). Debug-Builds laufen
// auch ohne die Datei — dann mit lauter Warnung statt still.
if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn("WARNUNG: android/app/google-services.json fehlt — in diesem Build stürzt die App beim Einschalten der Mitteilungen ab (siehe ANDROID.md).")
}
