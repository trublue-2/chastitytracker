<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ChastityTracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --text-muted: #888;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --radius: 14px;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f5;
        --card: #ffffff;
        --border: #e0e0e0;
        --text: #111;
        --text-muted: #666;
      }
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 20px) 24px env(safe-area-inset-bottom, 20px);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      width: 100%;
      max-width: 380px;
    }

    .logo {
      width: 56px;
      height: 56px;
      background: var(--accent);
      border-radius: 14px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg { color: white; }

    h1 {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
      transition: border-color 0.15s;
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
    }

    .input-wrap span {
      padding: 0 10px 0 14px;
      font-size: 14px;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    input {
      flex: 1;
      padding: 13px 14px 13px 0;
      font-size: 15px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      min-width: 0;
    }

    input::placeholder { color: var(--text-muted); }

    .error {
      font-size: 13px;
      color: #f87171;
      margin-bottom: 16px;
      display: none;
    }
    .error.visible { display: block; }

    button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      font-family: inherit;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: default; }

    .link-btn {
      width: auto;
      background: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 10px;
      text-decoration: underline;
    }
    .link-btn:hover { background: none; color: var(--text); }

    .spinner {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .spinner.visible { display: flex; }
    .card.loading .form-content { display: none; }
    .card.loading .spinner { display: flex; }

    .spin {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card loading" id="card">
    <!-- Loading spinner (shown while checking saved URL) -->
    <div class="spinner" id="spinner">
      <div class="spin"></div>
      <span style="font-size:14px;color:var(--text-muted)" id="spinnerText">Verbinde…</span>
      <button type="button" id="changeBtn" class="link-btn" style="display:none">Andere Adresse</button>
    </div>

    <!-- Setup form -->
    <div class="form-content" id="formContent">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1>ChastityTracker</h1>
      <p class="subtitle">Gib deine Instanz-Adresse ein, um die App zu verbinden.</p>

      <label for="subdomain">Deine Instanz-URL</label>
      <div class="input-wrap">
        <span>https://</span>
        <input
          id="subdomain"
          type="text"
          inputmode="url"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          placeholder="name.trublue.ch"
          autofocus
        />
      </div>

      <div class="error" id="error">Bitte gib eine gültige Instanz-URL ein.</div>

      <button id="btn" onclick="connect()">Verbinden</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'ct_instance_url';

    let savedHost = null;        // hostname of the stored instance, for prefill on failure
    let preflightAbort = null;   // AbortController of the in-flight reachability probe
    let cancelled = false;       // user tapped "Andere Adresse" during the probe

    const ALLOWED_DOMAINS = [
      /^[a-z0-9-]+\.trublue\.ch$/i,
      /^[a-z0-9-]+\.chastitytracker\.ch$/i,
      /^[a-z0-9-]+\.chastity-tracker\.com$/i,
    ];

    function isAllowed(hostname) {
      return ALLOWED_DOMAINS.some(re => re.test(hostname));
    }

    function redirect(url) {
      document.getElementById('changeBtn').style.display = 'none';
      document.getElementById('card').classList.add('loading');
      window.location.replace(url);
    }

    // Capacitor Preferences with localStorage fallback
    async function storageSave(value) {
      if (window.Capacitor?.Plugins?.Preferences) {
        await window.Capacitor.Plugins.Preferences.set({ key: STORAGE_KEY, value });
      } else {
        localStorage.setItem(STORAGE_KEY, value);
      }
    }

    async function storageLoad() {
      if (window.Capacitor?.Plugins?.Preferences) {
        const { value } = await window.Capacitor.Plugins.Preferences.get({ key: STORAGE_KEY });
        return value;
      }
      return localStorage.getItem(STORAGE_KEY);
    }

    async function storageRemove() {
      if (window.Capacitor?.Plugins?.Preferences) {
        await window.Capacitor.Plugins.Preferences.remove({ key: STORAGE_KEY });
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    async function connect() {
      const raw = document.getElementById('subdomain').value.trim();
      const errorEl = document.getElementById('error');
      errorEl.classList.remove('visible');

      // Accept either a full URL or just the hostname
      let url;
      try {
        url = raw.startsWith('http') ? new URL(raw) : new URL('https://' + raw);
      } catch {
        showError('Bitte gib eine gültige Instanz-URL ein.');
        return;
      }

      if (!isAllowed(url.hostname)) {
        showError('Diese Domain ist nicht erlaubt. Nutze eine gültige Instanz-Adresse.');
        return;
      }

      // Probe before saving/redirecting, so a wrong address is caught here instead of
      // navigating the WebView into a dead page it can't return from.
      const finalUrl = url.origin + '/';

      // Offline: can't verify — save and redirect rather than falsely blaming the address.
      if (navigator.onLine === false) {
        await storageSave(finalUrl);
        redirect(finalUrl);
        return;
      }

      const btn = document.getElementById('btn');
      const btnText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Verbinde…';
      const ok = await reachable(finalUrl);
      btn.disabled = false;
      btn.textContent = btnText;
      if (!ok) {
        showError('Verbindung zu ' + url.hostname + ' fehlgeschlagen. Bitte Adresse prüfen.');
        return;
      }

      await storageSave(finalUrl);
      redirect(finalUrl);
    }

    // Allow Enter key to submit
    document.getElementById('subdomain').addEventListener('keydown', e => {
      if (e.key === 'Enter') connect();
    });

    // Reachability probe: an opaque (no-cors) request resolves if the host answers at
    // all and rejects on DNS/connection failure or timeout — enough to tell a typo'd or
    // dead instance from a live one, without leaving the shell page first.
    async function reachable(target) {
      preflightAbort = new AbortController();
      const timer = setTimeout(() => preflightAbort.abort(), 5000);
      try {
        await fetch(target, { mode: 'no-cors', cache: 'no-store', signal: preflightAbort.signal });
        return true;
      } catch {
        return false;
      } finally {
        clearTimeout(timer);
        preflightAbort = null;
      }
    }

    function showError(msg) {
      const errorEl = document.getElementById('error');
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    }

    function showForm(prefillHost, errorMsg) {
      document.getElementById('card').classList.remove('loading');
      const input = document.getElementById('subdomain');
      if (prefillHost) input.value = prefillHost;
      if (errorMsg) showError(errorMsg);
      else document.getElementById('error').classList.remove('visible');
      input.focus();
    }

    // Escape hatch while the spinner is up (e.g. a hung probe): abandon the saved URL
    // and return to the form, so a wrong address can never trap the app.
    document.getElementById('changeBtn').addEventListener('click', () => {
      cancelled = true;
      if (preflightAbort) preflightAbort.abort();
      showForm(savedHost, null);
    });

    // On load: probe the saved URL before navigating, and fall back to the form on
    // failure instead of redirecting into a dead page.
    window.addEventListener('load', async () => {
      cancelled = false;
      const saved = await storageLoad();
      let savedUrl = null;
      if (saved) {
        try {
          const u = new URL(saved);
          if (isAllowed(u.hostname)) savedUrl = u;
        } catch { /* invalid saved URL */ }
      }

      if (!savedUrl) {
        if (saved) await storageRemove();
        showForm();
        return;
      }

      savedHost = savedUrl.hostname;
      const target = savedUrl.origin + '/';
      document.getElementById('spinnerText').textContent = 'Verbinde mit ' + savedHost + '…';

      // Offline: skip the probe and redirect, so the service-worker cache can still serve
      // the app as before — a valid saved URL must never be blocked just for lack of network.
      if (navigator.onLine === false) {
        redirect(target);
        return;
      }

      // Reveal the escape shortly after, so even a slow probe stays interruptible.
      const revealEscape = setTimeout(() => {
        document.getElementById('changeBtn').style.display = '';
      }, 1500);

      const ok = await reachable(target);
      clearTimeout(revealEscape);
      if (cancelled) return;

      if (ok) {
        redirect(target);
      } else {
        showForm(savedHost, 'Verbindung zu ' + savedHost + ' fehlgeschlagen. Bitte Adresse prüfen.');
      }
    });
  </script>
</body>
</html>
